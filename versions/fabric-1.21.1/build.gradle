plugins {
    id "net.fabricmc.fabric-loom-remap" version "1.19.4"
}

// Fabric build of Minecraft 1.21.1. The mod code is the code of ../neoforge-1.21.1 (everything except its Forge/NeoForge
// entry point) plus the small Fabric entry point in ../fabric-common; Fabric Loader and Fabric API are required at run time.
def shared = "../neoforge-1.21.1"

base {
    archivesName = "AutoTranslation"
}
version = "${mod_version}+mc${minecraft_version}-fabric"
group = "me.langyue"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven { url "https://maven.blamejared.com" }
    maven { url "https://maven.architectury.dev/" }
    maven {
        url "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        url "https://maven.saps.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.ftb.mods"
        }
    }
    mavenCentral()
}

sourceSets {
    main {
        java {
            // the version independent engine is shared by every Minecraft version
            srcDir "../../core/src/main/java"
            srcDir "$shared/src/main/java"
            srcDir "../fabric-common/src/main/java"
            exclude "me/langyue/autotranslation/mc/AutoTranslationMod.java"
        }
        resources {
            srcDir "../../core/src/main/resources"
            srcDir "$shared/src/main/resources"
            srcDir "../fabric-common/src/main/resources"
            exclude "META-INF/**", "pack.mcmeta"
        }
    }
}

loom {
    runs {
        // Headless start-up check used by CI (see .github/workflows/versions.yml)
        smokeClient {
            client()
            property "autotranslation.smoketest", "true"
            property "autotranslation.smoketest.output", file("build/smoke/result.json").absolutePath
            programArg "--username"
            programArg "SmokeTester"
            runDir "build/smoke-run"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Fabric API is required at run time: Fabric Loader alone does not load the mod's own assets (language files,
    // textures); its resource loader does. Nothing is compiled against it.
    modLocalRuntime("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}") { exclude group: "net.fabricmc", module: "fabric-loader" }

    // Optional integrations are compile-only: the game starts without them.
    modCompileOnly("dev.ftb.mods:ftb-library-fabric:${ftb_library_version}") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-quests-fabric:${ftb_quests_version}") { transitive = false }
    modCompileOnly("vazkii.patchouli:Patchouli:${patchouli_version}") { transitive = false }
}

// -PsmokeMods puts the optional integrations on the runtime classpath of runSmokeClient.
if (project.hasProperty("smokeMods")) {
    dependencies {
        // FTB Quests needs Fabric API (already on the runtime classpath) and Architectury API when it runs
        // (Fabric API is compile-only as well so that Loom can resolve the methods these mods inherit from it when it remaps them)
        modCompileOnly("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}") { exclude group: "net.fabricmc", module: "fabric-loader" }
        modLocalRuntime("dev.architectury:architectury-fabric:13.0.8") { transitive = false }
        modLocalRuntime("dev.ftb.mods:ftb-library-fabric:${ftb_library_version}") { transitive = false }
        modLocalRuntime("dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}") { transitive = false }
        modLocalRuntime("dev.ftb.mods:ftb-quests-fabric:${ftb_quests_version}") { transitive = false }
        // Team Reborn Energy: FTB Quests (task screen block) needs it on Fabric
        modLocalRuntime("teamreborn:energy:4.1.0") { transitive = false }
        modLocalRuntime("vazkii.patchouli:Patchouli:${patchouli_version}") { transitive = false }
        // config library of Patchouli on Fabric (plain jar, not a mod)
        localRuntime("me.zeroeightsix:fiber:0.23.0-2") { transitive = false }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

processResources {
    def props = [version: mod_version, minecraft_range: "~1.21.1", java_version: "21"]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}
