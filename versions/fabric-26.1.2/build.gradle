plugins {
    id "net.fabricmc.fabric-loom" version "1.19.4"
}

// Fabric build of Minecraft 26.1.2. The mod code is the code of ../neoforge-26.1.2 (everything except its Forge/NeoForge
// entry point) plus the small Fabric entry point in ../fabric-common; Fabric Loader and Fabric API are required at run time.
def shared = "../neoforge-26.1.2"

base {
    archivesName = "AutoTranslation"
}
version = "${mod_version}+mc${minecraft_version}-fabric"
group = "me.langyue"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    maven { url "https://maven.blamejared.com" }
    maven { url "https://maven.architectury.dev/" }
    maven {
        url "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        url "https://maven.saps.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.ftb.mods"
        }
    }
    mavenCentral()
}

sourceSets {
    main {
        java {
            // the version independent engine is shared by every Minecraft version
            srcDir "../../core/src/main/java"
            srcDir "$shared/src/main/java"
            srcDir "../fabric-common/src/main/java"
            exclude "me/langyue/autotranslation/mc/AutoTranslationMod.java"
        }
        resources {
            srcDir "../../core/src/main/resources"
            srcDir "$shared/src/main/resources"
            srcDir "../fabric-common/src/main/resources"
            exclude "META-INF/**", "pack.mcmeta"
        }
    }
}

loom {
    runs {
        // Headless start-up check used by CI (see .github/workflows/versions.yml)
        smokeClient {
            client()
            property "autotranslation.smoketest", "true"
            property "autotranslation.smoketest.output", file("build/smoke/result.json").absolutePath
            programArg "--username"
            programArg "SmokeTester"
            runDir "build/smoke-run"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Fabric API is required at run time: Fabric Loader alone does not load the mod's own assets (language files,
    // textures); its resource loader does. Nothing is compiled against it.
    localRuntime("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}") { exclude group: "net.fabricmc", module: "fabric-loader" }

    // Optional integrations are compile-only: the game starts without them.
    compileOnly("dev.ftb.mods:ftb-library-fabric:${ftb_library_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-quests-fabric:${ftb_quests_version}") { transitive = false }
}

// -PsmokeMods puts the optional integrations on the runtime classpath of runSmokeClient.
if (project.hasProperty("smokeMods")) {
    dependencies {
        // FTB Quests needs Fabric API (already on the runtime classpath) when it runs
        localRuntime("dev.ftb.mods:ftb-library-fabric:${ftb_library_version}") { transitive = false }
        localRuntime("dev.ftb.mods:ftb-teams-fabric:${ftb_teams_version}") { transitive = false }
        localRuntime("dev.ftb.mods:ftb-quests-fabric:${ftb_quests_version}") { transitive = false }
        // Team Reborn Energy: FTB Quests (task screen block) needs it on Fabric
        localRuntime("teamreborn:energy:5.0.0") { transitive = false }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

processResources {
    // Fabric API's mod id was "fabric" before it became "fabric-api" (the 1.16.5 build is older than the rename)
    def props = [version: mod_version, minecraft_range: ">=26.1.2 <26.2", java_version: "25",
                 fabric_api_id: "fabric-api"]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}
