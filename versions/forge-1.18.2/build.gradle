plugins {
    id "dev.architectury.loom" version "1.3-SNAPSHOT"
}

base {
    archivesName = "AutoTranslation"
}
version = "${mod_version}+mc${minecraft_version}-forge"
group = "me.langyue"

repositories {
    maven { url "https://maven.minecraftforge.net/" }
    maven { url "https://maven.blamejared.com" }
    maven { url "https://maven.architectury.dev/" }
    maven {
        url "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        url "https://maven.saps.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        // Item Filters, which FTB Quests needs on these versions, is published on CurseForge only
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    mavenCentral()
}

loom {
    silentMojangMappingsLicense()
    forge {
        mixinConfigs = ["autotranslation.mixins.json"]
    }
    runs {
        // Headless start-up check used by CI (see .github/workflows/versions.yml)
        smokeClient {
            client()
            property "autotranslation.smoketest", "true"
            property "autotranslation.smoketest.output", file("build/smoke/result.json").absolutePath
            programArg "--username"
            programArg "SmokeTester"
            runDir "build/smoke-run"
        }
    }
}

sourceSets {
    main {
        // the version independent engine is shared by every Minecraft version
        java.srcDir "../../core/src/main/java"
        resources.srcDir "../../core/src/main/resources"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${forge_version}"

    // Optional integrations are compile-only: the game starts without them.
    modCompileOnly("dev.ftb.mods:ftb-library-forge:${ftb_library_version}") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}") { transitive = false }
    modCompileOnly("vazkii.patchouli:Patchouli:${patchouli_version}")
}

// -PsmokeMods puts the optional integrations on the runtime classpath of runSmokeClient.
if (project.hasProperty("smokeMods")) {
    dependencies {
        // FTB Quests / Library require Architectury API when they run
        modLocalRuntime("dev.architectury:architectury-forge:${architectury_version}")
        modLocalRuntime("dev.ftb.mods:ftb-library-forge:${ftb_library_version}") { transitive = false }
        modLocalRuntime("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}") { transitive = false }
        modLocalRuntime("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}") { transitive = false }
        // mandatory dependency of FTB Quests here ("itemfilters"); CurseForge file of the matching Item Filters build
        modLocalRuntime("curse.maven:item-filters-309674:4553322")
        modLocalRuntime("vazkii.patchouli:Patchouli:${patchouli_version}")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": mod_version
    }
}

jar {
    archiveClassifier.set("dev")
}
