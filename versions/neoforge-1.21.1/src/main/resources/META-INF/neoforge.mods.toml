modLoader = "javafml"
loaderVersion = "[4,)"
license = "GNU Affero General Public License v3.0"
issueTrackerURL = "https://github.com/yuefdev/minecraft-ai-translator/issues/new"

[[mixins]]
config = "autotranslation.mixins.json"

[[mods]]
modId = "autotranslation"
version = "${version}"
displayName = "AutoTranslation"
authors = "yuefdev; based on AutoTranslation by 墨涤千尘"
description = '''
Translates the English text of your mods into the language you picked in Minecraft while you play: item names,
tooltips, menus, FTB Quests and Patchouli books. It works with no setup (keyless Google Translate) and better with a free Gemini key. Translation
happens when text is drawn; nothing in quest or book data is changed. Licensed under the GNU Affero General Public
License v3.0; based on AutoTranslation by 墨涤千尘.
'''

[[dependencies.autotranslation]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.autotranslation]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

# Optional integrations: the game starts without them; when present they are translated.
[[dependencies.autotranslation]]
modId = "ftbquests"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.autotranslation]]
modId = "patchouli"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
