plugins {
    id "java-library"
    id "net.neoforged.moddev" version "2.0.148"
}

base {
    archivesName = "AutoTranslation"
}
version = "${mod_version}+mc${minecraft_version}-neoforge"
group = "me.langyue"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url "https://maven.neoforged.net/releases" }
    maven { url "https://maven.blamejared.com" }
    maven { url "https://maven.architectury.dev/" }
    maven {
        url "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        url "https://maven.saps.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.ftb.mods"
        }
    }
}

sourceSets {
    main {
        // the version independent engine is shared by every Minecraft version
        java.srcDir "../../core/src/main/java"
        resources.srcDir "../../core/src/main/resources"
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        // Headless start-up check used by CI (see .github/workflows/versions.yml)
        smokeClient {
            client()
            gameDirectory = project.file("build/smoke-run")
            systemProperty "autotranslation.smoketest", "true"
            systemProperty "autotranslation.smoketest.output", project.file("build/smoke/result.json").absolutePath
            programArguments.addAll("--username", "SmokeTester")
        }
    }

    mods {
        autotranslation {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Optional integrations are compile-only: the game starts without them.
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive = false }
    compileOnly("vazkii.patchouli:Patchouli:${patchouli_version}") { transitive = false }
}

// -PsmokeMods puts the optional integrations on the runtime classpath of runSmokeClient.
if (project.hasProperty("smokeMods")) {
    dependencies {
        runtimeOnly "dev.architectury:architectury-neoforge:${architectury_version}"
        runtimeOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
        runtimeOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
        runtimeOnly("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive = false }
        runtimeOnly("vazkii.patchouli:Patchouli:${patchouli_version}") { transitive = false }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": mod_version
    }
}
