name: Other Minecraft versions

# Builds and start-up checks of the per-version modules under versions/. A version is only listed as supported
# in docs/VERIFICATION.md when both jobs below pass for it.
on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'versions/**'
      - 'core/**'
      - '.github/workflows/versions.yml'
  workflow_dispatch:

concurrency:
  group: versions-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: forge-1.19.2
            java: '17'
          - module: forge-1.18.2
            java: '17'
          - module: forge-1.16.5
            java: '17'
          - module: neoforge-1.21.1
            java: '21'
            gradle: '8.14.3'
          - module: forge-1.12.2
            java: '21'
            java_extra: '8'
            gradle: 'current'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.java_extra != ''
        with:
          java-version: ${{ matrix.java_extra }}
          distribution: 'temurin'
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ matrix.gradle || 'wrapper' }}
          cache-disabled: true
      - name: Build
        run: |
          chmod +x gradlew
          if [ "${{ matrix.gradle }}" != "" ]; then GRADLE=gradle; else GRADLE=./gradlew; fi
          set -o pipefail
          $GRADLE -p versions/${{ matrix.module }} build --no-daemon --console=plain 2>&1 | tee build.log
      - name: Result summary
        if: always()
        run: |
          echo "##### BUILD SUMMARY ${{ matrix.module }}"
          ls -l versions/${{ matrix.module }}/build/libs/ 2>&1 | tail -n 5
          grep -nE "error:|warning: \[|FAILED|What went wrong|Could not resolve|not found" -A3 build.log | head -n 60
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.module }}
          path: versions/${{ matrix.module }}/build/libs/*.jar

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [forge-1.19.2, forge-1.18.2, forge-1.16.5, neoforge-1.21.1, forge-1.12.2]
        variant: [plain, with-ftbquests-patchouli]
        include:
          - module: forge-1.19.2
            java: '17'
          - module: forge-1.18.2
            java: '17'
          - module: forge-1.16.5
            java: '17'
          - module: neoforge-1.21.1
            java: '21'
            gradle: '8.14.3'
          - module: forge-1.12.2
            java: '21'
            java_extra: '8'
            gradle: 'current'
            task: runClient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.java_extra != ''
        with:
          java-version: ${{ matrix.java_extra }}
          distribution: 'temurin'
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ matrix.gradle || 'wrapper' }}
          cache-disabled: true
      - name: Install headless display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxinerama1 libxcursor1 libxi6 libxxf86vm1 > /dev/null
      - name: Start the game and run the checks
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
          MODULE: versions/${{ matrix.module }}
        run: |
          chmod +x gradlew
          if [ "${{ matrix.gradle }}" != "" ]; then GRADLE=gradle; else GRADLE=./gradlew; fi
          TASK="${{ matrix.task || 'runSmokeClient' }}"
          extra="-PsmokeRun=true"
          if [ "${{ matrix.variant }}" = "with-ftbquests-patchouli" ]; then extra="$extra -PsmokeMods=true"; fi
          set +e
          ( while sleep 90; do echo "--- progress $(date +%T): $(wc -l < smoke.log) log lines ---"; tail -n 1 smoke.log | cut -c1-200; done ) &
          ticker=$!
          for attempt in 1 2; do
            timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" $GRADLE -p $MODULE $TASK $extra --no-daemon --console=plain > smoke.log 2>&1
            code=$?
            echo "=== attempt $attempt gradle exit code: $code ==="
            # a download hiccup of Mojang's or a maven host is not a result: try once more
            if [ ! -f $MODULE/build/smoke/result.json ] && grep -qE "DownloadException|Could not GET|Could not resolve|Connection reset|Read timed out" smoke.log; then
              echo "transient download problem, retrying once"; continue
            fi
            break
          done
          kill $ticker 2>/dev/null
          exit 0
      - name: Result summary
        if: always()
        env:
          MODULE: versions/${{ matrix.module }}
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "##### SMOKE SUMMARY ${{ matrix.module }} / ${{ matrix.variant }}"
          if [ ! -f $MODULE/build/smoke/result.json ]; then
            echo "NO RESULT FILE - the game did not reach the check phase"
            grep -nE "error:|Exception|ERROR|FATAL|FAILED|What went wrong|Mixin apply|InvalidInjection|Missing or unsupported|crash|Could not" smoke.log | head -n 40 | cut -c1-260
            echo "--- last lines"; tail -n 12 smoke.log | cut -c1-260
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open(os.environ["MODULE"] + "/build/smoke/result.json"))
          for c in r["checks"]:
              print(("PASS " if c["ok"] else "FAIL ") + c["name"] + (" :: " + c["detail"][:300] if c.get("detail") else ""))
          print("ok =", r["ok"], "| provider requests =", r["providerRequests"], "| ftbquests =", r["ftbquestsLoaded"], "| patchouli =", r["patchouliLoaded"])
          want_mods = os.environ["VARIANT"] == "with-ftbquests-patchouli"
          bad = []
          if not r["ok"]: bad.append("at least one check failed")
          if r["ftbquestsLoaded"] != want_mods or r["patchouliLoaded"] != want_mods: bad.append("unexpected optional mod set")
          if r["providerRequests"] < 1: bad.append("pipeline sent no request to the fake provider")
          if not r["authorizationHeaderSent"]: bad.append("API key was not sent as a bearer token")
          if bad:
              print("SMOKE TEST FAILED:", "; ".join(bad)); sys.exit(1)
          print("SMOKE TEST PASSED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.module }}-${{ matrix.variant }}
          path: |
            smoke.log
            versions/${{ matrix.module }}/build/smoke/result.json
            versions/${{ matrix.module }}/build/smoke-run/logs/latest.log
            versions/${{ matrix.module }}/build/smoke-run/crash-reports
          if-no-files-found: ignore
