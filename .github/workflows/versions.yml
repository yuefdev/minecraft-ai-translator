name: Other Minecraft versions

# Builds and start-up checks of the per-version modules under versions/. A version is only listed as supported
# in docs/VERIFICATION.md when both jobs below pass for it.
#
# The jobs deliberately use plain shell steps instead of setup actions: that keeps the end of every job log down to
# the result summary (which is the last thing printed).
on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'versions/**'
      - 'core/**'
      - '.github/workflows/versions.yml'
  workflow_dispatch:

concurrency:
  group: versions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: forge-1.19.2
            java: '17'
          - module: forge-1.18.2
            java: '17'
          - module: forge-1.16.5
            java: '17'
          - module: neoforge-1.21.1
            java: '21'
            gradle: '8.14.3'
          - module: forge-1.12.2
            java: '25'
            gradle: '9.8.1'
          - module: neoforge-26.1.2
            java: '25'
            gradle: '9.8.1'
    steps:
      - name: Check out
        run: git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" . 
      - name: Select Java and Gradle
        run: |
          jh="JAVA_HOME_${{ matrix.java }}_X64"; echo "JAVA_HOME=${!jh}" >> "$GITHUB_ENV"; echo "${!jh}/bin" >> "$GITHUB_PATH"
          if [ -n "${{ matrix.gradle }}" ]; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-${{ matrix.gradle }}-bin.zip" -o /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt && echo "/opt/gradle-${{ matrix.gradle }}/bin" >> "$GITHUB_PATH"
          fi
      - name: Build
        continue-on-error: true
        run: |
          chmod +x gradlew
          if [ -n "${{ matrix.gradle }}" ]; then GRADLE=gradle; else GRADLE=./gradlew; fi
          $GRADLE -p versions/${{ matrix.module }} build --no-daemon --console=plain > build.log 2>&1
          echo "exit=$?" > build.status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jar-${{ matrix.module }}
          path: versions/${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: ignore
      - name: Result summary
        run: |
          echo "##### BUILD SUMMARY ${{ matrix.module }} ($(cat build.status 2>/dev/null))"
          ls -l versions/${{ matrix.module }}/build/libs/ 2>&1 | tail -n 4
          if grep -q "exit=0" build.status; then echo "BUILD PASSED"; exit 0; fi
          grep -nE "error:|FAILED|What went wrong|Could not|not found|Unsupported|Caused by" -A3 build.log | head -n 45 | cut -c1-240
          echo "BUILD FAILED"; exit 1

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [forge-1.19.2, forge-1.18.2, forge-1.16.5, neoforge-1.21.1, forge-1.12.2, neoforge-26.1.2]
        variant: [plain, with-ftbquests-patchouli]
        include:
          - module: forge-1.19.2
            java: '17'
          - module: forge-1.18.2
            java: '17'
          - module: forge-1.16.5
            java: '17'
          - module: neoforge-1.21.1
            java: '21'
            gradle: '8.14.3'
          - module: forge-1.12.2
            java: '25'
            gradle: '9.8.1'
            task: runClient
          - module: neoforge-26.1.2
            java: '25'
            gradle: '9.8.1'
            no_patchouli: 'true'
    steps:
      - name: Check out
        run: git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" .
      - name: Select Java and Gradle, install headless display
        run: |
          jh="JAVA_HOME_${{ matrix.java }}_X64"; echo "JAVA_HOME=${!jh}" >> "$GITHUB_ENV"; echo "${!jh}/bin" >> "$GITHUB_PATH"
          if [ -n "${{ matrix.gradle }}" ]; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-${{ matrix.gradle }}-bin.zip" -o /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt && echo "/opt/gradle-${{ matrix.gradle }}/bin" >> "$GITHUB_PATH"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxinerama1 libxcursor1 libxi6 libxxf86vm1 x11-xserver-utils > /dev/null
      - name: Start the game and run the checks
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
          MODULE: versions/${{ matrix.module }}
        run: |
          chmod +x gradlew
          # LWJGL 2 (1.12.2) reads the display modes from the xrandr tool and wants a legacy GL context
          if [ "${{ matrix.module }}" = "forge-1.12.2" ]; then unset MESA_GL_VERSION_OVERRIDE MESA_GLSL_VERSION_OVERRIDE; fi
          if [ -n "${{ matrix.gradle }}" ]; then GRADLE=gradle; else GRADLE=./gradlew; fi
          TASK="${{ matrix.task || 'runSmokeClient' }}"
          extra="-PsmokeRun=true"
          if [ "${{ matrix.variant }}" = "with-ftbquests-patchouli" ]; then extra="$extra -PsmokeMods=true"; fi
          set +e
          ( while sleep 120; do echo "--- progress $(date +%T): $(wc -l < smoke.log) log lines ---"; done ) &
          ticker=$!
          for attempt in 1 2; do
            rm -f smoke.exit
            # own process group, so that a crashed game (which waits on its error screen) can be stopped at once
            setsid bash -c "timeout 900 xvfb-run -a -s '-screen 0 1280x720x24' $GRADLE -p $MODULE $TASK $extra --no-daemon --console=plain > smoke.log 2>&1; echo \$? > smoke.exit" &
            group=$!
            while [ ! -f smoke.exit ]; do
              sleep 5
              if [ ! -f $MODULE/build/smoke/result.json ] && grep -qE "Crash report saved to|Minecraft Crash Report" smoke.log 2>/dev/null; then
                sleep 10
                echo "=== the game crashed; stopping it instead of waiting for the timeout ==="
                kill -TERM -- -$group 2>/dev/null; sleep 5; kill -KILL -- -$group 2>/dev/null
                echo crashed > smoke.exit
              fi
            done
            echo "=== attempt $attempt gradle exit code: $(cat smoke.exit) ==="
            # a download hiccup of Mojang's or a maven host is not a result: try once more
            if [ ! -f $MODULE/build/smoke/result.json ] && grep -qE "DownloadException|Could not GET|Could not resolve|Connection reset|Read timed out" smoke.log; then
              echo "transient download problem, retrying once"; continue
            fi
            break
          done
          kill $ticker 2>/dev/null
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.module }}-${{ matrix.variant }}
          path: |
            smoke.log
            versions/${{ matrix.module }}/build/smoke/result.json
            versions/${{ matrix.module }}/build/smoke-run/logs/latest.log
            versions/${{ matrix.module }}/build/smoke-run/crash-reports
            versions/${{ matrix.module }}/run/logs/latest.log
          if-no-files-found: ignore
      - name: Result summary
        env:
          MODULE: versions/${{ matrix.module }}
          VARIANT: ${{ matrix.variant }}
          NO_PATCHOULI: ${{ matrix.no_patchouli }}
        run: |
          echo "##### SMOKE SUMMARY ${{ matrix.module }} / ${{ matrix.variant }}"
          if [ ! -f $MODULE/build/smoke/result.json ]; then
            echo "NO RESULT FILE - the game did not reach the check phase"
            grep -nE "error:|FAILED|What went wrong|Mixin apply|InvalidInjection|Missing or unsupported|Could not" smoke.log | head -n 12 | cut -c1-240
            grep -A8 "Missing or unsupported mandatory dependencies" smoke.log | head -n 10 | cut -c1-240
            echo "--- first failure and its causes"
            grep -nE "FATAL|ExceptionInInitializerError|ReportedException|Caused by:|Description:|UnsatisfiedLink|LinkageError|NoSuchMethod|NoClassDef|ClassNotFound|Mixin|IllegalState" smoke.log | grep -v "ALSA\|AL lib" | head -n 24 | cut -c1-260
            echo "--- stack of the first exception"
            awk '/ExceptionInInitializerError|ReportedException|Exception in thread|java.lang.RuntimeException/{f=1} f{print; if(++n>22) exit}' smoke.log | grep -v "ALSA\|AL lib" | cut -c1-200
            echo "--- last lines"; tail -n 4 smoke.log | cut -c1-240
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open(os.environ["MODULE"] + "/build/smoke/result.json"))
          for c in r["checks"]:
              print(("PASS " if c["ok"] else "FAIL ") + c["name"] + (" :: " + c["detail"][:300] if c.get("detail") else ""))
          print("ok =", r["ok"], "| provider requests =", r["providerRequests"], "| ftbquests =", r["ftbquestsLoaded"], "| patchouli =", r["patchouliLoaded"], "| betterquesting =", r.get("betterquestingLoaded"))
          want_mods = os.environ["VARIANT"] == "with-ftbquests-patchouli"
          bad = []
          if not r["ok"]: bad.append("at least one check failed")
          want_patchouli = want_mods and os.environ.get("NO_PATCHOULI") != "true"
          if r["ftbquestsLoaded"] != want_mods or r["patchouliLoaded"] != want_patchouli: bad.append("unexpected optional mod set")
          if r["providerRequests"] < 1: bad.append("pipeline sent no request to the fake provider")
          if not r["authorizationHeaderSent"]: bad.append("API key was not sent as a bearer token")
          if bad:
              print("SMOKE TEST FAILED:", "; ".join(bad)); sys.exit(1)
          print("SMOKE TEST PASSED")
          PY
