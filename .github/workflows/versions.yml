name: Other Minecraft versions

# Builds and start-up checks of the per-version modules under versions/. A version is only listed as supported
# in docs/VERIFICATION.md when both jobs below pass for it.
on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'versions/**'
      - 'core/**'
      - '.github/workflows/versions.yml'
  workflow_dispatch:

concurrency:
  group: versions-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: forge-1.19.2
            java: '17'
          - module: forge-1.18.2
            java: '17'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew -p versions/${{ matrix.module }} build --no-daemon --console=plain
      - name: List the jar
        run: ls -l versions/${{ matrix.module }}/build/libs/
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.module }}
          path: versions/${{ matrix.module }}/build/libs/*.jar

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [forge-1.19.2, forge-1.18.2]
        variant: [plain, with-ftbquests-patchouli]
        include:
          - module: forge-1.19.2
            java: '17'
          - module: forge-1.18.2
            java: '17'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Install headless display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxinerama1 libxcursor1 libxi6 libxxf86vm1 > /dev/null
      - name: Start the game and run the checks
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
          MODULE: versions/${{ matrix.module }}
        run: |
          chmod +x gradlew
          extra=""
          if [ "${{ matrix.variant }}" = "with-ftbquests-patchouli" ]; then extra="-PsmokeMods=true"; fi
          set +e
          ( while sleep 60; do echo "--- progress $(date +%T): $(wc -l < smoke.log) log lines ---"; tail -n 2 smoke.log | cut -c1-220; ls $MODULE/build/smoke-run/logs/latest.log > /dev/null 2>&1 && grep -E "smoke|Smoke|AutoTranslation|Mixin|ERROR" $MODULE/build/smoke-run/logs/latest.log | tail -n 3 | cut -c1-220; done ) &
          ticker=$!
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -p $MODULE runSmokeClient $extra --no-daemon --console=plain > smoke.log 2>&1
          code=$?
          kill $ticker 2>/dev/null
          echo "=== gradle exit code: $code ==="
          if [ -f $MODULE/build/smoke/result.json ]; then
            python3 - <<'PY'
          import json, os
          r = json.load(open(os.environ["MODULE"] + "/build/smoke/result.json"))
          for c in r["checks"]:
              print(("PASS " if c["ok"] else "FAIL ") + c["name"] + (" :: " + c["detail"] if c.get("detail") else ""))
          print("ok =", r["ok"], "| provider requests =", r["providerRequests"], "| ftbquests =", r["ftbquestsLoaded"], "| patchouli =", r["patchouliLoaded"])
          PY
          else
            echo "NO RESULT FILE - the game did not reach the check phase"
            grep -nE "Exception|ERROR|FATAL|Mixin apply|InvalidInjection|Missing|crash|error:" smoke.log | head -n 40
            tail -n 25 smoke.log
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open(os.environ["MODULE"] + "/build/smoke/result.json"))
          want_mods = "${{ matrix.variant }}" == "with-ftbquests-patchouli"
          bad = []
          if not r["ok"]: bad.append("at least one check failed")
          if r["ftbquestsLoaded"] != want_mods or r["patchouliLoaded"] != want_mods: bad.append("unexpected optional mod set")
          if r["providerRequests"] < 1: bad.append("pipeline sent no request to the fake provider")
          if not r["authorizationHeaderSent"]: bad.append("API key was not sent as a bearer token")
          if bad:
              print("SMOKE TEST FAILED:", "; ".join(bad)); sys.exit(1)
          print("SMOKE TEST PASSED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.module }}-${{ matrix.variant }}
          path: |
            smoke.log
            versions/${{ matrix.module }}/build/smoke/result.json
            versions/${{ matrix.module }}/build/smoke-run/logs/latest.log
            versions/${{ matrix.module }}/build/smoke-run/crash-reports
          if-no-files-found: ignore
