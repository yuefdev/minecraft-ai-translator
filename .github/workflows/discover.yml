name: Discover dependency versions

# Prints the published versions of every dependency we need for the additional Minecraft versions,
# so the per-version modules are built from coordinates that really exist.
on:
  workflow_dispatch:
  push:
    branches: [ "claude/happy-rubin-fw6rqk" ]
    paths: [ ".github/workflows/discover.yml" ]

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch maven metadata
        run: |
          # name url grep-pattern  -> last 3 versions of every distinct leading prefix, version-sorted
          show() {
            echo "=== $1"
            curl -fsSL --max-time 60 "$2" -o meta.xml || { echo "(could not fetch $2)"; return; }
            grep -oE "<version>[^<]+</version>" meta.xml | sed -E 's/<[^>]+>//g' | grep -E "$3" | sort -V \
              | awk -v n=3 -v mode="${4:-dot}" '{ p=$0; if (mode=="dash") sub(/-.*/, "", p); else sub(/[-.].*/, "", p); a[p]=a[p] ? a[p] " " $0 : $0 }
                            END { for (k in a) { m=split(a[k], x, " "); s=""; for (i=(m>n?m-n+1:1); i<=m; i++) s=s " " x[i]; print "  " k ":" s } }' | sort
          }
          show "FTB Quests forge"     https://maven.ftb.dev/releases/dev/ftb/mods/ftb-quests-forge/maven-metadata.xml "^(1605|1802|1902|2001)\."
          show "FTB Quests neoforge"  https://maven.ftb.dev/releases/dev/ftb/mods/ftb-quests-neoforge/maven-metadata.xml "^2[0-9]{3}\."
          show "FTB Quests fabric"    https://maven.ftb.dev/releases/dev/ftb/mods/ftb-quests-fabric/maven-metadata.xml "^[0-9]"
          show "FTB Library forge"    https://maven.ftb.dev/releases/dev/ftb/mods/ftb-library-forge/maven-metadata.xml "^(1605|1802|1902|2001)\."
          show "FTB Library neoforge" https://maven.ftb.dev/releases/dev/ftb/mods/ftb-library-neoforge/maven-metadata.xml "^2[0-9]{3}\."
          show "FTB Teams forge"      https://maven.ftb.dev/releases/dev/ftb/mods/ftb-teams-forge/maven-metadata.xml "^(1605|1802|1902|2001)\."
          show "FTB Teams neoforge"   https://maven.ftb.dev/releases/dev/ftb/mods/ftb-teams-neoforge/maven-metadata.xml "^2[0-9]{3}\."
          show "Patchouli"            https://maven.blamejared.com/vazkii/patchouli/Patchouli/maven-metadata.xml "^1\.(16|18|19|20|21)|^[0-9]+\.[0-9]+(\.[0-9]+)?-" dash
          show "Forge (all MC)"       https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml "^1\.[0-9]+(\.[0-9]+)?-[0-9]" dash
          show "NeoForge"             https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml "^[0-9]"
          show "Architectury forge"   https://maven.architectury.dev/dev/architectury/architectury-forge/maven-metadata.xml "^[0-9]"
          show "Architectury neoforge" https://maven.architectury.dev/dev/architectury/architectury-neoforge/maven-metadata.xml "^[0-9]"
          show "Cloth Config forge"   https://maven.shedaniel.me/me/shedaniel/cloth/cloth-config-forge/maven-metadata.xml "^[0-9]"
          show "Cloth Config neoforge" https://maven.shedaniel.me/me/shedaniel/cloth/cloth-config-neoforge/maven-metadata.xml "^[0-9]"
          show "MixinBooter (1.12.2)" https://maven.cleanroommc.com/zone/rong/mixinbooter/maven-metadata.xml "^[0-9]"
          show "Fabric loader"        https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml "^0\.1[5-9]"
          show "Fabric API"           https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml "^0\.[0-9]+\.[0-9]+\+(1\.(16|18|19|20|21)|2[0-9])"
          echo "=== Mojang version manifest"
          curl -fsSL --max-time 60 https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o vm.json && \
            python3 -c "import json;d=json.load(open('vm.json'));print(d['latest']);r=[v['id'] for v in d['versions'] if v['type']=='release'];print('releases (newest first):',' '.join(r[:25]))"
          echo "=== Plugin portals"
          for u in \
            https://plugins.gradle.org/m2/com/gtnewhorizons/retrofuturagradle/com.gtnewhorizons.retrofuturagradle.gradle.plugin/maven-metadata.xml \
            https://plugins.gradle.org/m2/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml \
            https://plugins.gradle.org/m2/net/neoforged/moddev/legacyforge/net.neoforged.moddev.legacyforge.gradle.plugin/maven-metadata.xml \
            https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml \
            https://maven.architectury.dev/dev/architectury/architectury-loom/maven-metadata.xml ; do
            echo "-- $u"; curl -fsSL --max-time 60 "$u" -o m.xml && grep -oE "<version>[^<]+</version>" m.xml | sed -E 's/<[^>]+>//g' | sort -V | tail -n 4 | tr '\n' ' ' || echo "(not found)"; echo
          done
      - name: Targeted lists
        run: |
          all() { # name url regex
            echo "=== $1"
            curl -fsSL --max-time 60 "$2" -o t.xml || { echo "(could not fetch $2)"; return; }
            grep -oE "<version>[^<]+</version>" t.xml | sed -E 's/<[^>]+>//g' | grep -E "$3" | sort -V | tr '\n' ' '; echo
          }
          all "Patchouli 1.16/1.18/1.19/1.20/1.21 (non-snapshot)" https://maven.blamejared.com/vazkii/patchouli/Patchouli/maven-metadata.xml "^1\.(16|18|19|20|21)" | sed 's/[^ ]*SNAPSHOT[^ ]* //g'
          all "FTB Quests forge 1605/1802/1902" https://maven.ftb.dev/releases/dev/ftb/mods/ftb-quests-forge/maven-metadata.xml "^(1605|1802|1902)\." 
          all "FTB Quests neoforge 2101" https://maven.ftb.dev/releases/dev/ftb/mods/ftb-quests-neoforge/maven-metadata.xml "^2101\." 
          all "FTB Quests neoforge 26" https://maven.ftb.dev/releases/dev/ftb/mods/ftb-quests-neoforge/maven-metadata.xml "^26\." 
          all "FTB Library neoforge 26" https://maven.ftb.dev/releases/dev/ftb/mods/ftb-library-neoforge/maven-metadata.xml "^(26|2111)\."
          all "FTB Teams neoforge 26" https://maven.ftb.dev/releases/dev/ftb/mods/ftb-teams-neoforge/maven-metadata.xml "^(26|2111)\."
          all "Forge 1.16.5 / 1.18.2 / 1.19.2" https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml "^(1\.16\.5|1\.18\.2|1\.19\.2)-" | tr ' ' '\n' | awk 'NR<3 || /-(36\.2\.(3|4)[0-9]|40\.[23]\.[0-9]+|43\.[2-5]\.[0-9]+)$/' | tr '\n' ' '; echo
          all "NeoForge 21.1" https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml "^21\.1\.2[0-9][0-9]$" | tr ' ' '\n' | tail -n 4 | tr '\n' ' '; echo
          all "NeoForge 26.x" https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml "^26\." | tr ' ' '\n' | tail -n 6 | tr '\n' ' '; echo
          all "Patchouli neoforge 26?" https://maven.blamejared.com/vazkii/patchouli/Patchouli/maven-metadata.xml "^(26|1\.21\.[2-9]|1\.21\.1[0-9])" 
          all "BetterQuesting (various mavens)" https://maven.blamejared.com/betterquesting/BetterQuesting/maven-metadata.xml ".*"
      - name: Latest Minecraft lines
        run: |
          curl -fsSL --max-time 60 https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml -o n.xml
          echo "=== NeoForge: newest version per Minecraft line (21.x and 26.x)"
          grep -oE "<version>[^<]+</version>" n.xml | sed -E 's/<[^>]+>//g' | grep -E "^(21|26)\." | sort -V | awk -F. '{k=$1"."$2; last[k]=$0} END {for (k in last) print last[k]}' | sort -V
          for p in ftb-quests ftb-library ftb-teams; do
            curl -fsSL --max-time 60 https://maven.ftb.dev/releases/dev/ftb/mods/$p-neoforge/maven-metadata.xml -o f.xml || continue
            echo "=== $p-neoforge: newest per line"
            grep -oE "<version>[^<]+</version>" f.xml | sed -E 's/<[^>]+>//g' | grep -E "^(21|26|2111|2110|2104|2100)" | sort -V | awk -F. '{k=$1"."$2; last[k]=$0} END {for (k in last) print last[k]}' | sort -V
          done
          curl -fsSL --max-time 60 https://maven.architectury.dev/dev/architectury/architectury-neoforge/maven-metadata.xml -o a.xml && { echo "=== architectury-neoforge"; grep -oE "<version>[^<]+</version>" a.xml | sed -E 's/<[^>]+>//g' | sort -V | tail -n 8 | tr '\n' ' '; echo; }
          curl -fsSL --max-time 60 https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o vm.json && python3 - <<'PY'
          import json,urllib.request
          d=json.load(open("vm.json"))
          for v in d["versions"]:
              if v["id"] in ("26.1.2","26.3"):
                  m=json.load(urllib.request.urlopen(v["url"]))
                  print(v["id"], "java", m.get("javaVersion"), "assets", m.get("assets"), "type", v["type"])
          PY
      - name: Verify exact coordinates
        run: |
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" -I --max-time 30 "$1"); echo "$code  $1"; }
          A=https://maven.architectury.dev/dev/architectury
          F=https://maven.ftb.dev/releases/dev/ftb/mods
          B=https://maven.blamejared.com/vazkii/patchouli/Patchouli
          for v in 1.32.68 1.32.66 1.31.51; do check $A/architectury-forge/$v/architectury-forge-$v.jar; done
          for v in 4.12.94 3.9.66; do check $A/architectury-forge/$v/architectury-forge-$v.jar; done
          check $A/architectury-forge/6.6.92/architectury-forge-6.6.92.jar
          check $A/architectury-neoforge/13.0.8/architectury-neoforge-13.0.8.jar
          check $F/ftb-quests-forge/1605.3.7-build.199/ftb-quests-forge-1605.3.7-build.199.jar
          check $F/ftb-library-forge/1605.3.5-build.724/ftb-library-forge-1605.3.5-build.724.jar
          check $F/ftb-teams-forge/1605.3.0-build.157/ftb-teams-forge-1605.3.0-build.157.jar
          check $F/ftb-quests-forge/1802.3.16-build.479/ftb-quests-forge-1802.3.16-build.479.jar
          check $F/ftb-library-forge/1802.3.12-build.726/ftb-library-forge-1802.3.12-build.726.jar
          check $F/ftb-teams-forge/1802.2.11-build.152/ftb-teams-forge-1802.2.11-build.152.jar
          check $F/ftb-quests-forge/1902.5.10-build.497/ftb-quests-forge-1902.5.10-build.497.jar
          check $F/ftb-library-forge/1902.4.2-build.701/ftb-library-forge-1902.4.2-build.701.jar
          check $F/ftb-teams-forge/1902.2.14-build.165/ftb-teams-forge-1902.2.14-build.165.jar
          check $F/ftb-quests-neoforge/2101.1.36/ftb-quests-neoforge-2101.1.36.jar
          check $F/ftb-library-neoforge/2101.1.36/ftb-library-neoforge-2101.1.36.jar
          check $F/ftb-teams-neoforge/2101.1.11/ftb-teams-neoforge-2101.1.11.jar
          check $B/1.16.4-53.3/Patchouli-1.16.4-53.3.jar
          check $B/1.18.2-71.1/Patchouli-1.18.2-71.1.jar
          check $B/1.19.2-77/Patchouli-1.19.2-77.jar
          check $B/1.21.1-93-NEOFORGE/Patchouli-1.21.1-93-NEOFORGE.jar
      - name: 1.12.2 / 1.16.5 sources
        run: |
          for u in https://maven.architectury.dev/me/shedaniel/architectury-forge/maven-metadata.xml https://maven.architectury.dev/me/shedaniel/architectury/maven-metadata.xml https://maven.architectury.dev/dev/architectury/architectury-forge/maven-metadata.xml; do
            echo "-- $u"; curl -fsSL --max-time 30 "$u" -o m.xml && grep -oE "<version>[^<]+</version>" m.xml | sed -E 's/<[^>]+>//g' | sort -V | grep -E "^(1\.|2\.)" | tail -n 6 | tr '\n' ' ' || echo "(not found)"; echo
          done
          echo "=== Modrinth: 1.12.2 candidates"
          for slug in betterquesting better-questing ftb-quests patchouli mixinbooter; do
            echo "-- $slug"
            curl -fsSL --max-time 30 "https://api.modrinth.com/v2/project/$slug" -o p.json 2>/dev/null && python3 - <<'PY'
          import json
          p = json.load(open("p.json"))
          print(p.get("title"), "|", p.get("game_versions", [])[:8], "...", p.get("loaders"))
          PY
            curl -fsSL --max-time 30 -G "https://api.modrinth.com/v2/project/$slug/version" --data-urlencode 'game_versions=["1.12.2"]' -o v.json 2>/dev/null && python3 - <<'PY'
          import json
          for v in json.load(open("v.json"))[:4]:
              f = v["files"][0]
              print("  ", v["version_number"], v["loaders"], f["url"], f["hashes"].get("sha1"))
          PY
          done
          echo "=== GitHub releases: BetterQuesting"
          for repo in BetterQuesting/BetterQuesting Funwayguy/BetterQuesting; do
            curl -fsSL --max-time 30 "https://api.github.com/repos/$repo/releases?per_page=3" -o r.json 2>/dev/null && python3 - <<'PY'
          import json
          for r in json.load(open("r.json")):
              print("  ", r["tag_name"], [a["browser_download_url"] for a in r.get("assets", [])][:3])
          PY
          done
          echo "=== cursemaven probe"
          curl -s -o /dev/null -w "%{http_code}  cursemaven root\n" -I --max-time 30 https://www.cursemaven.com/
      - name: CurseForge file ids via CFWidget (1.12.2)
        run: |
          for p in minecraft/mc-mods/better-questing minecraft/mc-mods/ftb-quests minecraft/mc-mods/ftblib minecraft/mc-mods/patchouli; do
            echo "-- $p"
            curl -fsSL --max-time 40 "https://api.cfwidget.com/$p" -o w.json 2>/dev/null && python3 - <<'PY'
          import json
          w = json.load(open("w.json"))
          print("id", w.get("id"), "title", w.get("title"))
          fs = [f for f in w.get("files", []) if "1.12.2" in f.get("versions", [])]
          for f in fs[-3:]:
              print("  file", f["id"], f["name"], f.get("versions"), f.get("type"))
          PY
            echo
          done
          echo "=== GitHub: BetterQuesting repos"
          for repo in BetterQuesting/BetterQuesting Funwayguy/BetterQuesting; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://api.github.com/repos/$repo)
            echo "$code $repo"
          done
      - name: RetroFuturaGradle and 1.12.2 toolchain
        run: |
          for u in \
            https://nexus.gtnewhorizons.com/repository/public/com/gtnewhorizons/retrofuturagradle/com.gtnewhorizons.retrofuturagradle.gradle.plugin/maven-metadata.xml \
            https://nexus.gtnewhorizons.com/repository/public/com/gtnewhorizons/retrofuturagradle/maven-metadata.xml \
            https://maven.cleanroommc.com/zone/rong/mixinbooter/maven-metadata.xml ; do
            echo "-- $u"; curl -fsSL --max-time 40 "$u" -o m.xml && grep -oE "<version>[^<]+</version>" m.xml | sed -E 's/<[^>]+>//g' | sort -V | tail -n 6 | tr '\n' ' ' || echo "(not found)"; echo
          done
          echo "-- blamejared Patchouli 1.0-*"
          curl -fsSL --max-time 40 https://maven.blamejared.com/vazkii/patchouli/Patchouli/maven-metadata.xml -o m.xml && grep -oE "<version>1\.0[^<]*</version>" m.xml | sed -E 's/<[^>]+>//g' | tail -n 4 | tr '\n' ' '; echo
          echo "-- gradle wrapper versions on services.gradle.org (current)"
          curl -fsSL --max-time 30 https://services.gradle.org/versions/current | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])"
      - name: CFWidget details (ids and newest 1.12.2 files)
        run: |
          for p in minecraft/mc-mods/better-questing minecraft/mc-mods/ftb-quests minecraft/mc-mods/ftblib minecraft/mc-mods/item-filters minecraft/mc-mods/itemfilters minecraft/mc-mods/patchouli; do
            echo "-- $p"
            curl -fsSL --max-time 40 "https://api.cfwidget.com/$p" -o w.json 2>/dev/null && python3 - <<'PY'
          import json
          w = json.load(open("w.json"))
          print("project id", w.get("id"), "|", w.get("title"), "| urls", w.get("urls", {}).get("curseforge"))
          fs = [f for f in w.get("files", []) if "1.12.2" in f.get("versions", [])]
          fs.sort(key=lambda f: f.get("uploaded_at", ""))
          for f in fs[-3:]:
              print("  file", f["id"], f["name"], f.get("uploaded_at"), f.get("type"))
          PY
            echo
          done
      - name: Dependencies of FTB Quests / Library for 26.1.2 and the jar's neoforge.mods.toml
        run: |
          F=https://maven.ftb.dev/releases/dev/ftb/mods
          for a in ftb-quests-neoforge:26.1.2.9 ftb-library-neoforge:26.1.2.9 ftb-teams-neoforge:26.1.2.4; do
            n=${a%%:*}; v=${a##*:}
            echo "=== $n $v (pom dependencies)"
            curl -fsSL --max-time 30 $F/$n/$v/$n-$v.pom -o p.pom && grep -E "<(groupId|artifactId|version|scope)>" p.pom | tr -d ' \t' | paste -sd' ' | sed 's/<\/dependency>/\n/g' | head -n 12 | cut -c1-200
            curl -fsSL --max-time 60 $F/$n/$v/$n-$v.jar -o j.jar && unzip -p j.jar META-INF/neoforge.mods.toml | grep -E "modId|versionRange|type|^version|loaderVersion" | head -n 24
          done
          echo "=== Patchouli on other mavens for 26.x"
          curl -s -o /dev/null -w "%{http_code} modrinth patchouli 26.1.2\n" "https://api.modrinth.com/v2/project/patchouli/version?game_versions=%5B%2226.1.2%22%5D"
          curl -fsSL --max-time 30 -G "https://api.modrinth.com/v2/project/patchouli/version" --data-urlencode 'game_versions=["26.1.2"]' | python3 -c "import json,sys; v=json.load(sys.stdin); print(len(v), [x['version_number'] for x in v][:3])"
          echo "=== NeoForge 26.1.2.x versions"
          curl -fsSL --max-time 30 https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE "<version>26\.1\.2[^<]*</version>" | sed -E 's/<[^>]+>//g' | sort -V | tail -n 3
      - name: Inspect FTB Quests / Library 26.1.2 classes
        run: |
          F=https://maven.ftb.dev/releases/dev/ftb/mods
          mkdir -p jars && cd jars
          for a in ftb-quests-neoforge:26.1.2.9 ftb-quests:26.1.2.9 ftb-library-neoforge:26.1.2.9 ftb-library:26.1.2.9 ftb-teams-neoforge:26.1.2.4 ftb-teams:26.1.2.4; do
            n=${a%%:*}; v=${a##*:}
            curl -fsSL --max-time 90 $F/$n/$v/$n-$v.jar -o $n.jar || echo "no jar for $n"
          done
          CP=$(ls *.jar | tr '\n' ':')
          echo "=== classes named ScreenWrapper / BaseScreen / QuestScreen"
          for j in *.jar; do unzip -l $j | awk '{print $4}' | grep -E 'ScreenWrapper|/BaseScreen|/QuestScreen' | sed "s|^|$j: |"; done
          echo "=== QuestScreen declaration"
          javap -p -cp "$CP" dev.ftb.mods.ftbquests.client.gui.quests.QuestScreen | head -n 3
          echo "=== super chain"
          javap -p -cp "$CP" dev.ftb.mods.ftblibrary.client.gui.screen.BaseScreen 2>&1 | head -n 3
          echo "=== Panel refreshWidgets"
          javap -p -cp "$CP" dev.ftb.mods.ftblibrary.client.gui.widget.Panel 2>&1 | grep -E "refreshWidgets|class " | head -n 3
          echo "=== Minecraft screen class that wraps FTB guis"
          unzip -l ftb-library.jar | awk '{print $4}' | grep -iE "screen" | head -n 20

  # Forge 1.16.5 under Architectury Loom crashed while baking models: BlockMath calls Transformation.func_227987_b_
  # (an SRG name) on the mojmap-named game jar. Show what the dev jars really contain.
  inspect-forge-1165:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        run: git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" .
      - name: Inspect the dev game jars
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"; export JAVA_HOME=$JAVA_HOME_17_X64; export PATH=$JAVA_HOME/bin:$PATH
          chmod +x gradlew
          ./gradlew -p versions/forge-1.16.5 compileJava --no-daemon --console=plain > b.log 2>&1 || { tail -n 30 b.log; exit 1; }
          jars=$(find ~/.gradle versions/forge-1.16.5/.gradle -name "*.jar" 2>/dev/null | grep -E "minecraft|forge-1\.16\.5" | grep -vE "sources|launcher|userdev|installer" | sort -u)
          echo "=== candidate jars"; echo "$jars" | sed 's|^.*/||' | head -n 20
          for j in $jars; do
            if unzip -l "$j" 2>/dev/null | grep -q "com/mojang/math/Transformation.class"; then
              echo "=== $(basename $j): Transformation methods returning Transformation"
              javap -p -cp "$j" com.mojang.math.Transformation | grep -E "Transformation [a-zA-Z_0-9]+\(" | head -n 12
              echo "--- BlockMath invokes"
              javap -c -p -cp "$j" net.minecraft.core.BlockMath | grep -E "invoke.*Transformation\." | sort | uniq -c | head -n 12
            fi
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/util/math/vector/TransformationMatrix.class"; then
              echo "=== $(basename $j) (srg): TransformationMatrix methods"
              javap -p -cp "$j" net.minecraft.util.math.vector.TransformationMatrix | grep -E "TransformationMatrix [a-zA-Z_0-9]+\(" | head -n 12
            fi
          done
          echo "=== mapping entries for func_227987_b_ and its neighbours"
          for m in $(find ~/.gradle versions/forge-1.16.5/.gradle -name "*.tiny" -o -name "*.tsrg" 2>/dev/null | head -n 20); do
            c=$(grep -c "func_227987_b_" "$m" 2>/dev/null); [ "$c" != "0" ] && { echo "--- $(echo $m | sed 's|^.*/caches/||') ($c)"; grep -n -B2 -A2 "func_227987_b_" "$m" | head -n 12; }
          done
          echo "=== Transformation class mapping lines"
          for m in $(find ~/.gradle versions/forge-1.16.5/.gradle -name "*.tiny" 2>/dev/null | head -n 20); do
            grep -nE "^c\s.*com/mojang/math/Transformation\s|^CLASS.*com/mojang/math/Transformation$" "$m" | head -n 2 | sed "s|^|$(basename $m): |"
          done

  # FTB Quests on 1.16.5 / 1.18.2 / 1.19.2 refused to load in the start-up check ("Missing or unsupported mandatory
  # dependencies"). Print what each jar declares, and which Item Filters builds exist.
  ftb-legacy-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Declared dependencies
        run: |
          get() { for base in https://maven.ftb.dev/releases https://maven.saps.dev/releases https://maven.architectury.dev; do
                    curl -fsSL --max-time 60 "$base/$1" -o "$2" 2>/dev/null && return 0; done; return 1; }
          for a in ftb-quests-forge:1605.3.7-build.199 ftb-library-forge:1605.3.5-build.724 ftb-teams-forge:1605.3.0-build.157 \
                   ftb-quests-forge:1802.3.16-build.479 ftb-library-forge:1802.3.12-build.726 ftb-teams-forge:1802.2.11-build.152 \
                   ftb-quests-forge:1902.5.10-build.497 ftb-library-forge:1902.4.2-build.701 ftb-teams-forge:1902.2.14-build.165; do
            n=${a%%:*}; v=${a##*:}
            echo "=== $n $v"
            if get "dev/ftb/mods/$n/$v/$n-$v.jar" j.jar; then
              unzip -p j.jar META-INF/mods.toml | tr -d '\r' | awk '/\[\[dependencies/{d=1} d && /modId|mandatory|versionRange|type/{printf "%s ", $0} /side/{if(d) print ""}' | sed 's/  */ /g' | head -n 12
            else echo "(jar not found)"; fi
          done
      - name: Item Filters and Architectury builds
        run: |
          for g in https://maven.ftb.dev/releases https://maven.saps.dev/releases; do
            for a in dev/latvian/mods/item-filters-forge dev/ftb/mods/item-filters-forge; do
              curl -fsSL --max-time 30 "$g/$a/maven-metadata.xml" -o m.xml 2>/dev/null || continue
              echo "=== $g/$a"; grep -oE "<version>(1605|1802|1902)[^<]*</version>" m.xml | sed -E 's/<[^>]+>//g' | sort -V | awk -F. '{k=$1; last[k]=$0} END {for (k in last) print "  " k ": " last[k]}'
            done
          done
          curl -fsSL --max-time 30 https://maven.architectury.dev/me/shedaniel/architectury-forge/maven-metadata.xml | grep -oE "<version>1\.[0-9]+\.[0-9]+</version>" | sed -E 's/<[^>]+>//g' | sort -V | tail -n 3 | sed 's/^/  architectury-forge (1.16): /'
          curl -fsSL --max-time 30 https://maven.architectury.dev/dev/architectury/architectury-forge/maven-metadata.xml | grep -oE "<version>(4|6)\.[0-9]+\.[0-9]+</version>" | sed -E 's/<[^>]+>//g' | sort -V | awk -F. '{last[$1]=$0} END {for (k in last) print "  architectury-forge " k ".x latest: " last[k]}'

  item-filters-files:
    runs-on: ubuntu-latest
    steps:
      - name: Item Filters files for 1.16.5 / 1.18.2 / 1.19.2 (Forge) on CurseForge
        run: |
          curl -fsSL --max-time 40 "https://api.cfwidget.com/minecraft/mc-mods/item-filters" -o w.json
          python3 - <<'PY'
          import json
          w = json.load(open("w.json"))
          print("project id", w.get("id"), "|", w.get("title"))
          for mc in ("1.16.5", "1.18.2", "1.19.2"):
              fs = [f for f in w.get("files", []) if mc in f.get("versions", []) and ("Forge" in f.get("versions", []) or "forge" in f["name"].lower())]
              fs.sort(key=lambda f: f.get("uploaded_at", ""))
              for f in fs[-2:]:
                  print(mc, "file", f["id"], f["name"], f.get("uploaded_at"), f.get("type"), [v for v in f.get("versions", []) if not v[0].isdigit()])
          PY
