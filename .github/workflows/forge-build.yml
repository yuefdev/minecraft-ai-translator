name: Forge 1.20.1 build

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # The translation engine has no Minecraft dependency, so it is tested as its own build.
      - name: Core unit tests
        run: |
          chmod +x gradlew
          set +e
          ./gradlew -p core test --no-daemon --console=plain > core-test.log 2>&1
          code=$?
          echo "=== core tests (exit $code) ==="
          grep -cE " PASSED$" core-test.log | sed 's/^/passed: /'
          grep -E " (FAILED|SKIPPED)$" core-test.log | head -n 40
          grep -E -A12 "What went wrong" core-test.log | head -n 40
          exit $code

      - name: Build Forge jar
        run: |
          set +e
          ./gradlew :forge:build --no-daemon --console=plain > forge-build.log 2>&1
          code=$?
          echo "=== forge build (exit $code) ==="
          grep -E -A14 "What went wrong" forge-build.log | head -n 50
          grep -E -B1 -A3 "error:" forge-build.log | head -n 80
          grep -E "BUILD (SUCCESSFUL|FAILED)" forge-build.log
          exit $code

      - name: Inspect the built jar
        if: always()
        run: |
          shopt -s nullglob
          for jar in forge/build/libs/*.jar; do
            echo "== $jar ($(stat -c %s "$jar") bytes)"
            sha256sum "$jar"
            case "$jar" in *-dev*|*-sources*|*-shadow*) continue;; esac
            echo "core engine classes bundled : $(unzip -l "$jar" | grep -c 'me/langyue/autotranslation/core/.*\.class')"
            echo "mod classes (tr/gui/mixin)  : $(unzip -l "$jar" | grep -cE 'autotranslation/(tr|gui|mixin)/.*\.class')"
            echo "Turkish language file       : $(unzip -l "$jar" | grep -c 'assets/autotranslation/lang/tr_tr.json')"
            echo "starter glossary            : $(unzip -l "$jar" | grep -c 'autotranslation/glossary-tr.json')"
            echo "mixin configs / refmaps     :"; unzip -l "$jar" | grep -E "mixins.json|refmap" | awk '{print "   " $4}'
            unzip -p "$jar" META-INF/mods.toml | grep -E '^(version|modId|displayName|license) ' | head -n 4
          done

      - name: Scan the repository for credential-like strings
        run: |
          # only counts are printed, never the matches; test fixtures and the smoke test use obviously fake keys
          n=$(git grep -IlE "sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}" -- . ':!core/src/test' ':!common/src/main/java/me/langyue/autotranslation/smoke' | wc -l)
          echo "files with credential-like strings outside test fixtures: $n"
          test "$n" -eq 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-libs
          path: forge/build/libs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-and-reports
          path: |
            core-test.log
            forge-build.log
            core/build/reports
