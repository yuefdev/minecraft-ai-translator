name: Forge 1.20.1 build

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # The translation engine has no Minecraft dependency, so it is tested as its own build.
      - name: Core unit tests
        run: |
          chmod +x gradlew
          set +e
          ./gradlew -p core test --no-daemon --console=plain > core-test.log 2>&1
          code=$?
          echo "=== core tests (exit $code) ==="
          grep -cE " PASSED$" core-test.log | sed 's/^/passed: /'
          grep -E " (FAILED|SKIPPED)$" core-test.log | head -n 40
          grep -E -A12 "What went wrong" core-test.log | head -n 40
          exit $code

      - name: Build Forge jar
        run: |
          set +e
          ./gradlew :forge:build --no-daemon --console=plain > forge-build.log 2>&1
          code=$?
          echo "=== forge build (exit $code) ==="
          grep -E -A14 "What went wrong" forge-build.log | head -n 50
          grep -E -B1 -A3 "error:" forge-build.log | head -n 80
          grep -E "BUILD (SUCCESSFUL|FAILED)" forge-build.log
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-libs
          path: forge/build/libs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-and-reports
          path: |
            core-test.log
            forge-build.log
            core/build/reports
