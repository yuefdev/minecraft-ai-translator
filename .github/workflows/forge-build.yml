name: Forge 1.20.1 build

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Forge jar
        run: |
          chmod +x gradlew
          ./gradlew :forge:build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-libs
          path: forge/build/libs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports
            **/build/test-results
