name: Forge 1.20.1 build

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Core unit tests
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :core:test --no-daemon --console=plain > core-test.log 2>&1
          code=$?
          echo "::group::core test summary"
          grep -E "PASSED|FAILED|SKIPPED|tests completed|BUILD" core-test.log | tail -n 120
          echo "::endgroup::"
          exit $code
      - name: Build Forge jar
        run: |
          set +e
          ./gradlew :forge:build --no-daemon --console=plain > forge-build.log 2>&1
          code=$?
          echo "=== filtered build output (exit $code) ==="
          grep -nE "error:|warning: \[|Could not|What went wrong|FAILED|BUILD (SUCCESSFUL|FAILED)|Caused by|InvalidInjection|Mixin|cannot find symbol|symbol:|location:" forge-build.log | head -n 80
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-libs
          path: forge/build/libs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-and-reports
          path: |
            core-test.log
            forge-build.log
            core/build/reports
