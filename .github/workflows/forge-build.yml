name: Forge 1.20.1 build

# Builds the 1.20.1 Forge jar with the project's own Gradle wrapper (./gradlew :forge:build, the Linux twin of
# gradlew.bat :forge:build) and runs the engine's unit tests. Shell steps only, so the end of the log is the summary.
on:
  push:
    branches:
      - 'claude/**'
    paths-ignore:
      - '.github/workflows/discover.yml'
      - '.github/workflows/versions.yml'
      - '.github/workflows/prod-1122.yml'
      - '.github/workflows/live-free.yml'
      - 'versions/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        run: git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" .
      - name: Select Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"; echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      # The translation engine has no Minecraft dependency, so it is tested as its own build.
      - name: Core unit tests
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew -p core test --no-daemon --console=plain > core-test.log 2>&1
          echo "exit=$?" > core-test.status

      - name: Build Forge jar
        continue-on-error: true
        run: |
          ./gradlew :forge:build --no-daemon --console=plain > forge-build.log 2>&1
          echo "exit=$?" > forge-build.status

      - name: Inspect the built jar
        continue-on-error: true
        run: |
          shopt -s nullglob
          for jar in forge/build/libs/*.jar; do
            echo "== $jar ($(stat -c %s "$jar") bytes)"
            sha256sum "$jar"
            case "$jar" in *-dev*|*-sources*|*-shadow*) continue;; esac
            echo "core engine classes bundled : $(unzip -l "$jar" | grep -c 'me/langyue/autotranslation/core/.*\.class')"
            echo "mod classes (tr/gui/mixin)  : $(unzip -l "$jar" | grep -cE 'autotranslation/(tr|gui|mixin)/.*\.class')"
            echo "Turkish language file       : $(unzip -l "$jar" | grep -c 'assets/autotranslation/lang/tr_tr.json')"
            echo "starter glossary            : $(unzip -l "$jar" | grep -c 'autotranslation/glossary-tr.json')"
            echo "mixin configs / refmaps     :"; unzip -l "$jar" | grep -E "mixins.json|refmap" | awk '{print "   " $4}'
            unzip -p "$jar" META-INF/mods.toml | grep -E '^(version|modId|displayName|license) ' | head -n 4
          done > jar-inspection.txt 2>&1

      - name: Scan the repository for credential-like strings
        continue-on-error: true
        run: |
          # only counts are printed, never the matches; test fixtures and the start-up checks use obviously fake keys
          n=$(git grep -IlE "sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}" -- . ':!core/src/test' ':(exclude,glob)**/SmokeTest.java' ':!common/src/main/java/me/langyue/autotranslation/smoke' | wc -l)
          echo "files with credential-like strings outside test fixtures: $n" > scan.txt
          test "$n" -eq 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-libs
          path: forge/build/libs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-and-reports
          path: |
            core-test.log
            forge-build.log
            jar-inspection.txt
            core/build/reports

      - name: Result summary
        run: |
          echo "##### 1.20.1 BUILD SUMMARY"
          echo "core tests : $(cat core-test.status 2>/dev/null) | passed lines: $(grep -cE ' PASSED$' core-test.log 2>/dev/null) | failed lines: $(grep -cE ' FAILED$' core-test.log 2>/dev/null)"
          echo "forge build: $(cat forge-build.status 2>/dev/null)"
          cat jar-inspection.txt 2>/dev/null | head -n 20
          cat scan.txt 2>/dev/null
          ok=1
          grep -q "exit=0" core-test.status || { ok=0; grep -E -A12 "What went wrong" core-test.log | head -n 30; grep -E " FAILED$" core-test.log | head -n 20; }
          grep -q "exit=0" forge-build.status || { ok=0; grep -E -A14 "What went wrong" forge-build.log | head -n 30; grep -E -B1 -A3 "error:" forge-build.log | head -n 40; }
          grep -qE ": 0$" scan.txt || { ok=0; echo "credential scan found files"; }
          [ "$ok" = 1 ] && echo "1.20.1 BUILD PASSED" || { echo "1.20.1 BUILD FAILED"; exit 1; }
