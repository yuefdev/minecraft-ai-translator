name: Game start-up smoke test

# Boots the real Minecraft 1.20.1 + Forge client headlessly (software OpenGL under Xvfb) and runs the checks in
# me.langyue.autotranslation.smoke.SmokeTest. One run without the optional mods, one with FTB Quests and Patchouli.
on:
  push:
    branches:
      - 'claude/**'
    paths-ignore:
      - '.github/workflows/discover.yml'
      - '.github/workflows/versions.yml'
      - 'versions/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# A newer push to the same branch supersedes a run that is still going.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, with-ftbquests-patchouli]
    steps:
      - name: Check out
        run: git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" .
      - name: Select Java 17, install headless display and software OpenGL
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"; echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 libxrandr2 libxinerama1 libxcursor1 libxi6 libxxf86vm1 > /dev/null
      - name: Start the game and run the checks
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
        run: |
          chmod +x gradlew
          extra=""
          if [ "${{ matrix.variant }}" = "with-ftbquests-patchouli" ]; then extra="-PsmokeMods=true"; fi
          set +e
          ( while sleep 120; do echo "--- progress $(date +%T): $(wc -l < smoke.log) log lines ---"; done ) &
          ticker=$!
          for attempt in 1 2; do
            timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :forge:runSmokeClient $extra --no-daemon --console=plain > smoke.log 2>&1
            echo "=== attempt $attempt gradle exit code: $? ==="
            if [ ! -f forge/build/smoke/result.json ] && grep -qE "DownloadException|Could not GET|Could not resolve|Connection reset|Read timed out" smoke.log; then
              echo "transient download problem, retrying once"; continue
            fi
            break
          done
          kill $ticker 2>/dev/null
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.variant }}
          path: |
            smoke.log
            forge/build/smoke/result.json
            forge/build/smoke-run/logs/latest.log
            forge/build/smoke-run/crash-reports
          if-no-files-found: ignore
      - name: Result summary
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "##### 1.20.1 SMOKE SUMMARY ($VARIANT)"
          if [ ! -f forge/build/smoke/result.json ]; then
            echo "NO RESULT FILE - the game did not reach the check phase"
            grep -nE "error:|Exception|ERROR|FATAL|FAILED|What went wrong|Mixin apply|InvalidInjection|Missing or unsupported|crash|Could not" smoke.log | head -n 30 | cut -c1-240
            echo "--- last lines"; tail -n 8 smoke.log | cut -c1-240
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open("forge/build/smoke/result.json"))
          for c in r["checks"]:
              print(("PASS " if c["ok"] else "FAIL ") + c["name"] + (" :: " + c["detail"][:300] if c.get("detail") else ""))
          print("ok =", r["ok"], "| provider requests =", r["providerRequests"], "| ftbquests =", r["ftbquestsLoaded"], "| patchouli =", r["patchouliLoaded"])
          want_mods = os.environ["VARIANT"] == "with-ftbquests-patchouli"
          bad = []
          if not r["ok"]: bad.append("at least one check failed")
          if r["ftbquestsLoaded"] != want_mods or r["patchouliLoaded"] != want_mods: bad.append("unexpected optional mod set")
          if want_mods and r["providerRequests"] < 3: bad.append("pipeline sent too few requests to the fake provider")
          if want_mods and not r["authorizationHeaderSent"]: bad.append("API key was not sent as a bearer token")
          if bad:
              print("SMOKE TEST FAILED:", "; ".join(bad)); sys.exit(1)
          print("SMOKE TEST PASSED")
          PY
