pluginManagement {
    repositories {
        mavenLocal()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
}

include("common")
include("forge")
// The first delivery targets Forge 1.20.1 only. The Fabric module is kept in the repository but is not part
// of the build unless explicitly enabled (./gradlew -PwithFabric=true ...); it has not been verified.
if (providers.gradleProperty("withFabric").isPresent()) {
    include("fabric")
}