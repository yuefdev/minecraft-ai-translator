plugins {
    id "java-library"
}

group = "me.langyue"
version = "1.0.0"

repositories {
    mavenCentral()
}

dependencies {
    // The game provides Gson at runtime (so it is not bundled). 2.2.4 is the version Minecraft 1.12.2 ships; compiling
    // against it guarantees that the engine only uses API that exists in every supported Minecraft version.
    compileOnly "com.google.code.gson:gson:2.2.4"

    testImplementation "com.google.code.gson:gson:2.10.1"
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// The engine is written for Java 8 (Minecraft 1.12.2 runs on Java 8) and works unchanged on every newer version.
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 8
}
tasks.named("compileTestJava") {
    options.release = 17
}

test {
    useJUnitPlatform()
    // -Dautotranslation.live=true runs the checks against real free services (CI job "Live free services")
    systemProperty "autotranslation.live", System.getProperty("autotranslation.live", "false")
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = System.getProperty("autotranslation.live") == "true"
        exceptionFormat = "full"
    }
}
