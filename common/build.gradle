dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"
    modApi("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation "vazkii.patchouli:Patchouli:${rootProject.patchouli_version}"
    modImplementation("dev.ftb.mods:ftb-library:${rootProject.ftb_library_version}") { transitive false }
    // Optional integrations: compile-only, never required at runtime.
    modCompileOnly("dev.ftb.mods:ftb-quests:${rootProject.ftb_quests_version}") { transitive false }
    modCompileOnly("dev.ftb.mods:ftb-teams:${rootProject.ftb_teams_version}") { transitive false }

}

// The Minecraft-independent translation engine lives in ../core and is compiled into this module, so that it ships
// inside the common jar (Architectury's production transform needs to see every class it references). The same
// sources are also built and unit-tested on their own: ./gradlew -p core test
sourceSets {
    main {
        java.srcDir "../core/src/main/java"
        resources.srcDir "../core/src/main/resources"
    }
}

architectury {
    if (rootProject.hasProperty("withFabric")) {
        common("fabric", "forge")
    } else {
        common("forge")
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
